[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.6.1"
description = "Reproducible benchmark harness for locally-served LLMs"
readme = {file = "docs/README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
llm-bench = "llm_benchmark.cli:app"
llm_benchmark = "llm_benchmark.cli:shell_entrypoint"
llm-benchmark = "llm_benchmark.cli:shell_entrypoint"
# Deprecated pre-rename aliases, kept so existing scripts and shell history
# keep working. Remove in 1.0. The underscore spelling is here because the
# pre-rename install put one in ~/.local/bin and muscle memory outlives a
# rename — without it, `spark_benchmark` stays a stale script importing a
# module that no longer exists.
spark-bench = "llm_benchmark.cli:app"
spark-benchmark = "llm_benchmark.cli:shell_entrypoint"
spark_benchmark = "llm_benchmark.cli:shell_entrypoint"

[tool.pytest.ini_options]
# So `pytest` works in a checkout without `pip install -e .`; CI installs the
# package and is unaffected.
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
