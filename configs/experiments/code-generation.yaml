experiment:
  name: code-generation-v1
  description: Code generation pass using the v1 HumanEval starter subset
  platforms:
    - local
  backend: ollama
  backend_version: local
  models:
    - qwen-3.6
    - gemma-4
    - nemotron-3
  suites:
    - code_generation
  sampling:
    temperature: 0.0
    top_p: 1.0
    seed: 42
    # 512 truncated 16 of 20 failures on the first full HumanEval run — the
    # models were cut off mid-function and scored as if they had written
    # broken code. Longer problems (humaneval/32, /116) need ~1200 tokens.
    max_tokens: 1536
  context_lengths:
    - 512
    - 4096
  repetitions: 1
  warmup_runs: 0
