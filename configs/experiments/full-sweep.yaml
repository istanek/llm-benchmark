experiment:
  name: full-sweep-v1
  description: >-
    Every axis in one bundle: contamination-probed code, both grounding
    fixtures, structured output and long-context retrieval, across the full
    lineup. Exists so a multi-hour run measures everything it can while the
    GPU is busy, instead of one suite at a time.
  platforms:
    - local
  backend: ollama
  backend_version: local
  models:
    - qwen-3.6
    - nemotron-3
    - gpt-oss-120b
    - gemma-4
  # Ordered cheapest-first on purpose. Each suite writes its summary as it
  # finishes, so if the tail drags or dies, everything ahead of it is already
  # on disk. The reliability suites cost minutes; the code suite costs hours.
  suites:
    - hallucination_grounding
    - hallucination_grounding_v2
    - practical_structured_output
    # The long pole (426 problems x 4 models, ~8 h). The original MBPP is
    # deliberately absent: its answers are already stored and are re-scored
    # offline with the same scorer, so re-asking would buy nothing but hours.
    - code_generation_mbpp_mutated
    # Fast profile: 18 cells per model rather than the full grid's 128. The
    # full grid runs 131k-token prefills over four lengths and four depths,
    # which is an open-ended tail on an already long run. Last in the order so
    # it cannot delay anything that matters more.
    - long_context_retrieval_fast
  sampling:
    temperature: 0.0
    top_p: 1.0
    seed: 42
    # Same budget as the MBPP run this is compared against. Raising it here
    # would make the contamination delta partly a budget difference — the one
    # thing the comparison must not contain.
    max_tokens: 1536
  context_lengths:
    - 512
    - 4096
  repetitions: 1
  warmup_runs: 0
